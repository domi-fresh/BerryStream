services:
  canopi:
    build:
      context: .
      network: host
    container_name: canopi
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
      - ./go2rtc.yaml:/app/go2rtc.yaml:ro
      - ./web:/app/web:ro
      - ./server.py:/app/server.py:ro
      - ./recordings:/app/recordings
