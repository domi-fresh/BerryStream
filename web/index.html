<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Canopi EVF Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #evf-feed {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: env(safe-area-inset-left, 18px);
      background: rgba(0, 0, 0, 0.65);
      color: #00ff66;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-alert { color: #ff3344 !important; }

    .ctrl-btn {
      position: absolute;
      background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.96); }

    #rec-btn {
      top: env(safe-area-inset-top, 16px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 20px;
      min-width: 110px;
    }
    #rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3344;
    }
    #rec-btn.recording {
      background: rgba(255, 51, 68, 0.25);
      border-color: #ff3344;
      color: #ff3344;
    }
    #rec-btn.recording #rec-dot { animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.2; } }

    #files-btn {
      bottom: env(safe-area-inset-bottom, 18px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 22px;
    }

    #sync-btn {
      bottom: env(safe-area-inset-bottom, 18px);
      left: env(safe-area-inset-left, 18px);
      padding: 12px 20px;
    }

    /* Full-screen Gallery Overlay */
    #gallery-view {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 40;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
    }
    #gallery-view.active { display: flex; }
    .gallery-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gallery-grid {
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: max-content;
      gap: 14px;
      padding: 16px 0 80px 0;
      align-content: start;
    }
    @media (orientation: landscape) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: max-content;
        gap: 14px;
      }
    }
    .card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: auto;
      min-height: max-content;
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1c1c1e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .card-meta {
      font-size: 11px;
      color: #aaa;
      flex-shrink: 0;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .btn-play, .btn-dl {
      flex: 1;
      height: 36px;
      min-height: 36px;
      padding: 0;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-play { background: #00ff66; color: #000; }
    .btn-dl { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .btn-del {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      background: #ff3344;
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-del:active {
      transform: scale(0.92);
      background: #cc2233;
    }
    .btn-disabled { opacity: 0.35; pointer-events: none; }

    /* Video Player Overlay */
    #player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-modal.active { display: flex; }
    #video-player {
      width: 100%;
      max-height: 85vh;
    }
    #close-player {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: env(safe-area-inset-right, 20px);
      padding: 10px 18px;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div id="hud">USB LINK • LIVE</div>

    <button id="rec-btn" class="ctrl-btn" onclick="toggleRecord()">
      <div id="rec-dot"></div>
      <span id="rec-text">REC</span>
    </button>

    <button id="sync-btn" class="ctrl-btn" onclick="syncStream()">SYNC</button>

    <button id="files-btn" class="ctrl-btn" onclick="openGallery()">GALLERY</button>

    <img id="evf-feed" alt="Live EVF Stream">
  </div>

  <!-- Gallery View -->
  <div id="gallery-view">
    <div class="gallery-header">
      <span style="color:#fff; font-size:18px; font-weight:700;">RECORDINGS</span>
      <button class="ctrl-btn" style="position:static; padding:8px 16px;" onclick="closeGallery()">BACK TO EVF</button>
    </div>
    <div class="gallery-grid" id="grid"></div>
  </div>

  <!-- Video Playback Modal -->
  <div id="player-modal">
    <button id="close-player" class="ctrl-btn" onclick="closePlayer()">CLOSE</button>
    <video id="video-player" controls playsinline webkit-playsinline></video>
  </div>

  <script>
    const streamImg = document.getElementById('evf-feed');
    const hud = document.getElementById('hud');
    const recBtn = document.getElementById('rec-btn');
    const recText = document.getElementById('rec-text');
    const viewportContainer = document.getElementById('viewport-container');
    const galleryView = document.getElementById('gallery-view');
    const playerModal = document.getElementById('player-modal');
    const videoPlayer = document.getElementById('video-player');

    let isRecording = false;
    let recTimer = null;
    let secondsElapsed = 0;
    let galleryPollTimer = null;
    let lastGalleryJson = "";

    function getStreamUrl() {
      return `${window.location.protocol}//${window.location.hostname}:1984/api/stream.mjpeg?src=evf`;
    }

    function startLiveStream() {
      streamImg.src = getStreamUrl();
    }

    streamImg.onerror = () => {
      if (isGalleryView) return;
      hud.textContent = "SIGNAL LOST • RETRYING";
      hud.classList.add('hud-alert');
      setTimeout(() => {
        if (!isGalleryView) {
          streamImg.src = `${getStreamUrl()}&t=${Date.now()}`;
        }
      }, 1000);
    };

    streamImg.onload = () => {
      hud.textContent = "USB LINK • LIVE";
      hud.classList.remove('hud-alert');
    };

    // Explicit Session Sync (Universal cross-browser reset)
    function syncStream() {
      try { window.stop(); } catch(e){}
      if (streamImg) streamImg.src = "";
      window.location.replace(`/?t=${Date.now()}`);
    }

    // Clean Session Navigation (Tears down Safari socket pools & decoders)
    function openGallery() {
      window.location.replace('/?view=gallery');
    }

    function closeGallery() {
      window.location.replace('/');
    }

    // Keep screen awake
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
    }
    requestWakeLock();

    // Sync recording status from server
    async function syncRecordStatus() {
      try {
        const res = await fetch('/api/record/status');
        const data = await res.json();
        if (data.recording) {
          isRecording = true;
          recBtn.classList.add('recording');
          secondsElapsed = data.elapsed || 0;
          const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          const secs = String(secondsElapsed % 60).padStart(2, '0');
          recText.textContent = `${mins}:${secs}`;
          if (!recTimer) {
            recTimer = setInterval(() => {
              secondsElapsed++;
              const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
              const s = String(secondsElapsed % 60).padStart(2, '0');
              recText.textContent = `${m}:${s}`;
            }, 1000);
          }
        }
      } catch(e) {}
    }

    // Toggle Record
    async function toggleRecord() {
      if (!isRecording) {
        const res = await fetch('/api/record/start');
        const data = await res.json();
        if (data.status === 'started' || data.status === 'already_recording') {
          isRecording = true;
          recBtn.classList.add('recording');
          secondsElapsed = 0;
          recTimer = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            recText.textContent = `${mins}:${secs}`;
          }, 1000);
        }
      } else {
        const res = await fetch('/api/record/stop');
        await res.json();
        isRecording = false;
        clearInterval(recTimer);
        recTimer = null;
        recBtn.classList.remove('recording');
        recText.textContent = 'REC';
      }
    }

    // Gallery Actions
    function startGalleryPolling() {
      if (!galleryPollTimer) {
        galleryPollTimer = setInterval(loadGallery, 2000);
      }
    }

    function stopGalleryPolling() {
      if (galleryPollTimer) {
        clearInterval(galleryPollTimer);
        galleryPollTimer = null;
      }
    }

    async function loadGallery() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/gallery');
        if (!res.ok) return;
        const data = await res.json();
        const jsonStr = JSON.stringify(data.items);
        if (jsonStr === lastGalleryJson) {
          return; // Skip re-rendering and re-fetching thumbnails if list has not changed
        }
        lastGalleryJson = jsonStr;

        grid.innerHTML = "";

        if (data.items.length === 0) {
          grid.innerHTML = "<div style='color:#777; grid-column: 1/-1; text-align:center; padding-top:40px;'>No clips recorded yet</div>";
          return;
        }

        data.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${item.thumb 
              ? `<img class="card-thumb" src="${item.thumb}" alt="thumb">` 
              : `<div class="card-thumb">PROCESSING...</div>`}
            <div class="card-body">
              <div class="card-title">${item.raw_name}</div>
              <div class="card-meta">${item.size_mb} MB • ${item.ready ? 'Ready' : 'Encoding...'}</div>
              <div class="card-actions">
                <button class="btn-play ${item.ready ? '' : 'btn-disabled'}" onclick="playVideo('${item.mp4}')">PLAY</button>
                <a class="btn-dl ${item.ready ? '' : 'btn-disabled'}" href="${item.mp4}" download>SAVE</a>
                <button class="btn-del" onclick="deleteRecording('${item.id}', '${item.raw_name}')" title="Delete Recording">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load gallery:", err);
      }
    }

    // Delete Recording with confirmation
    async function deleteRecording(id, name) {
      const confirmed = window.confirm(`Delete recording "${name}"?\n\nThis will permanently remove it from the Pi.`);
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/record/delete?id=${encodeURIComponent(id)}`, { method: 'POST' });
        const data = await res.json();
        if (data.status === 'deleted') {
          lastGalleryJson = "";
          loadGallery();
        } else {
          alert("Failed to delete recording: " + (data.message || "File not found"));
        }
      } catch (err) {
        console.error("Delete error:", err);
        alert("Error deleting recording");
      }
    }

    // Inline iOS Video Player
    function playVideo(url) {
      stopGalleryPolling();
      videoPlayer.src = url;
      playerModal.classList.add('active');
      videoPlayer.play();
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load(); // Forces iOS WebKit to release decoder and media buffers
      playerModal.classList.remove('active');
      startGalleryPolling();
    }

    // View Router based on URL state
    const urlParams = new URLSearchParams(window.location.search);
    const isGalleryView = urlParams.get('view') === 'gallery';

    if (isGalleryView) {
      // In Gallery View: NEVER load the EVF stream (0 Mbps over USB link)
      viewportContainer.style.display = 'none';
      galleryView.classList.add('active');
      loadGallery();
      startGalleryPolling();
    } else {
      // In Live View: Show EVF with clean native hardware MJPEG decoding
      galleryView.classList.remove('active');
      viewportContainer.style.display = 'flex';
      startLiveStream();
      syncRecordStatus();
    }
  </script>
</body>
</html>
