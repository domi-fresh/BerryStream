<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Canopi EVF Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #evf-feed {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: env(safe-area-inset-left, 18px);
      background: rgba(0, 0, 0, 0.65);
      color: #00ff66;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-alert { color: #ff3344 !important; }

    .ctrl-btn {
      position: absolute;
      background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.96); }

    #rec-btn {
      top: env(safe-area-inset-top, 16px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 20px;
      min-width: 110px;
    }
    #rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3344;
    }
    #rec-btn.recording {
      background: rgba(255, 51, 68, 0.25);
      border-color: #ff3344;
      color: #ff3344;
    }
    #rec-btn.recording #rec-dot { animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.2; } }

    #files-btn {
      bottom: env(safe-area-inset-bottom, 18px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 22px;
    }

    #sync-btn {
      bottom: env(safe-area-inset-bottom, 18px);
      left: env(safe-area-inset-left, 18px);
      padding: 12px 20px;
    }

    /* Full-screen Gallery Overlay */
    #gallery-view {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 40;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
    }
    #gallery-view.active { display: flex; }
    .gallery-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gallery-grid {
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: max-content;
      gap: 14px;
      padding: 16px 0 80px 0;
      align-content: start;
    }
    @media (orientation: landscape) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: max-content;
        gap: 14px;
      }
    }
    .card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: auto;
      min-height: max-content;
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1c1c1e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .card-meta {
      font-size: 11px;
      color: #aaa;
      flex-shrink: 0;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .btn-play, .btn-dl {
      flex: 1;
      height: 36px;
      min-height: 36px;
      padding: 0;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-play { background: #00ff66; color: #000; }
    .btn-dl { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .btn-del {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      background: #ff3344;
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-del:active {
      transform: scale(0.92);
      background: #cc2233;
    }
    .btn-disabled { opacity: 0.35; pointer-events: none; }

    /* Encoding Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff66, #00cc55);
      border-radius: 4px;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    /* Video Player Overlay */
    #player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-modal.active { display: flex; }
    #video-player {
      width: 100%;
      max-height: 85vh;
    }
    #close-player {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: env(safe-area-inset-right, 20px);
      padding: 10px 18px;
    }

    /* Settings Button below HUD */
    #settings-btn {
      top: calc(env(safe-area-inset-top, 16px) + 38px);
      left: env(safe-area-inset-left, 18px);
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 10px;
    }

    /* Full-screen Settings View Overlay */
    #settings-view {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 45;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
    }
    #settings-view.active { display: flex; }
    .settings-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .settings-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 0 60px 0;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }
    .settings-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #00ff66;
      text-transform: uppercase;
    }
    .section-desc {
      font-size: 11px;
      color: #888;
      margin-top: -6px;
    }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, border-color 0.15s;
    }
    .option-item:active {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      background: rgba(0, 255, 102, 0.1);
      border-color: rgba(0, 255, 102, 0.5);
    }
    .option-radio {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      outline: none;
      margin: 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-radio:checked {
      border-color: #00ff66;
      background: #00ff66;
      box-shadow: inset 0 0 0 3px #000;
    }
    .option-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .option-label {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .option-sub {
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div id="hud">USB LINK • LIVE</div>

    <button id="settings-btn" class="ctrl-btn" onclick="openSettings()" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <button id="rec-btn" class="ctrl-btn" onclick="toggleRecord()">
      <div id="rec-dot"></div>
      <span id="rec-text">REC</span>
    </button>

    <button id="sync-btn" class="ctrl-btn" onclick="syncStream()">SYNC</button>

    <button id="files-btn" class="ctrl-btn" onclick="openGallery()">GALLERY</button>

    <img id="evf-feed" alt="Live EVF Stream">
  </div>

  <!-- Settings View Overlay -->
  <div id="settings-view">
    <div class="settings-header">
      <span style="color:#fff; font-size:18px; font-weight:700;">SETTINGS</span>
      <button class="ctrl-btn" style="position:static; padding:8px 18px;" onclick="closeSettings()">DONE</button>
    </div>
    <div class="settings-content">
      <!-- Section 1: Stream Settings -->
      <div class="settings-section">
        <div class="section-title">Stream Settings</div>
        <div class="section-desc">HDMI Capture Resolution & Frame Rate</div>
        <div class="options-group" id="stream-presets-group">
          <label class="option-item selected" onclick="onSettingChange('stream_preset', '1080p60')">
            <input type="radio" class="option-radio" name="stream_preset" value="1080p60" checked>
            <div class="option-text">
              <span class="option-label">1080p 60fps</span>
              <span class="option-sub">Native Camera Pass-Through (Zero Latency)</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Section 2: Download Settings -->
      <div class="settings-section">
        <div class="section-title">Download Settings</div>
        <div class="section-desc">File Format & Gallery Display</div>
        <div class="options-group" id="download-format-group">
          <label class="option-item" onclick="onSettingChange('download_format', 'mp4')">
            <input type="radio" class="option-radio" name="download_format" value="mp4">
            <div class="option-text">
              <span class="option-label">MP4</span>
              <span class="option-sub">Optimized for iOS Photos & Sharing (Default)</span>
            </div>
          </label>
          <label class="option-item" onclick="onSettingChange('download_format', 'mkv')">
            <input type="radio" class="option-radio" name="download_format" value="mkv">
            <div class="option-text">
              <span class="option-label">MKV</span>
              <span class="option-sub">Raw Camera Stream (Uncompressed MJPEG)</span>
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="gallery-view">
    <div class="gallery-header">
      <span style="color:#fff; font-size:18px; font-weight:700;">RECORDINGS</span>
      <button class="ctrl-btn" style="position:static; padding:8px 16px;" onclick="closeGallery()">BACK TO EVF</button>
    </div>
    <div class="gallery-grid" id="grid"></div>
  </div>

  <!-- Video Playback Modal -->
  <div id="player-modal">
    <button id="close-player" class="ctrl-btn" onclick="closePlayer()">CLOSE</button>
    <video id="video-player" controls playsinline webkit-playsinline></video>
  </div>

  <script>
    const streamImg = document.getElementById('evf-feed');
    const hud = document.getElementById('hud');
    const recBtn = document.getElementById('rec-btn');
    const recText = document.getElementById('rec-text');
    const viewportContainer = document.getElementById('viewport-container');
    const galleryView = document.getElementById('gallery-view');
    const playerModal = document.getElementById('player-modal');
    const videoPlayer = document.getElementById('video-player');

    let isRecording = false;
    let recTimer = null;
    let heartbeatTimer = null;
    let secondsElapsed = 0;
    let galleryPollTimer = null;
    let lastGalleryJson = "";

    // Application Settings (Stream Presets & Download Format)
    let currentSettings = {
      stream_preset: "1080p60",
      download_format: "mp4"
    };

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        if (res.ok) {
          const data = await res.json();
          if (data.settings) currentSettings = { ...currentSettings, ...data.settings };
        }
      } catch(e) {
        const local = localStorage.getItem('canopi_settings');
        if (local) currentSettings = { ...currentSettings, ...JSON.parse(local) };
      }
      updateSettingsUI();
    }

    function updateSettingsUI() {
      document.querySelectorAll('input[name="stream_preset"]').forEach(radio => {
        const isMatch = radio.value === currentSettings.stream_preset;
        radio.checked = isMatch;
        const item = radio.closest('.option-item');
        if (item) item.classList.toggle('selected', isMatch);
      });
      document.querySelectorAll('input[name="download_format"]').forEach(radio => {
        const isMatch = radio.value === currentSettings.download_format;
        radio.checked = isMatch;
        const item = radio.closest('.option-item');
        if (item) item.classList.toggle('selected', isMatch);
      });
    }

    function openSettings() {
      loadSettings();
      document.getElementById('settings-view').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settings-view').classList.remove('active');
      lastGalleryJson = "";
      if (isGalleryView) {
        loadGallery();
      }
    }

    async function onSettingChange(type, value) {
      const prevStreamPreset = currentSettings.stream_preset;
      currentSettings[type] = value;
      localStorage.setItem('canopi_settings', JSON.stringify(currentSettings));
      updateSettingsUI();

      try {
        await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentSettings)
        });
      } catch(e) {}

      if (type === 'stream_preset' && value !== prevStreamPreset) {
        if (!isGalleryView) {
          startLiveStream();
        }
      }

      if (type === 'download_format') {
        lastGalleryJson = "";
        if (isGalleryView) {
          loadGallery();
        }
      }
    }

    function getStreamUrl() {
      return `${window.location.protocol}//${window.location.hostname}:1984/api/stream.mjpeg?src=evf`;
    }

    function startLiveStream() {
      streamImg.src = getStreamUrl();
    }

    streamImg.onerror = () => {
      if (isGalleryView) return;
      hud.textContent = "SIGNAL LOST • RETRYING";
      hud.classList.add('hud-alert');
      setTimeout(() => {
        if (!isGalleryView) {
          streamImg.src = `${getStreamUrl()}&t=${Date.now()}`;
        }
      }, 1000);
    };

    streamImg.onload = () => {
      hud.textContent = "USB LINK • LIVE";
      hud.classList.remove('hud-alert');
    };

    // Explicit Session Sync (Universal cross-browser reset)
    function syncStream() {
      try { window.stop(); } catch(e){}
      if (streamImg) streamImg.src = "";
      window.location.replace(`/?t=${Date.now()}`);
    }

    // Clean Session Navigation (Tears down Safari socket pools & decoders)
    function openGallery() {
      if (isRecording) {
        stopRecordingFailsafe();
      }
      window.location.replace('/?view=gallery');
    }

    function closeGallery() {
      window.location.replace('/');
    }

    // Failsafe auto-stop when backgrounded, app switched, or phone navigated away
    function stopRecordingFailsafe() {
      if (!isRecording) return;
      isRecording = false;
      clearInterval(recTimer);
      stopHeartbeat();
      recTimer = null;
      recBtn.classList.remove('recording');
      recText.textContent = 'REC';

      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/record/stop');
        } else {
          fetch('/api/record/stop', { keepalive: true });
        }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && isRecording) {
        stopRecordingFailsafe();
      }
    });

    window.addEventListener('pagehide', () => {
      if (isRecording) {
        stopRecordingFailsafe();
      }
    });

    function startHeartbeat() {
      if (!heartbeatTimer) {
        heartbeatTimer = setInterval(() => {
          if (isRecording) {
            fetch('/api/record/ping').catch(() => {});
          }
        }, 2000);
      }
    }

    function stopHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    // Keep screen awake
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
    }
    requestWakeLock();

    // Sync recording status from server
    async function syncRecordStatus() {
      try {
        const res = await fetch('/api/record/status');
        const data = await res.json();
        if (data.recording) {
          isRecording = true;
          recBtn.classList.add('recording');
          secondsElapsed = data.elapsed || 0;
          const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          const secs = String(secondsElapsed % 60).padStart(2, '0');
          recText.textContent = `${mins}:${secs}`;
          startHeartbeat();
          if (!recTimer) {
            recTimer = setInterval(() => {
              secondsElapsed++;
              const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
              const s = String(secondsElapsed % 60).padStart(2, '0');
              recText.textContent = `${m}:${s}`;
            }, 1000);
          }
        }
      } catch(e) {}
    }

    // Toggle Record
    async function toggleRecord() {
      if (!isRecording) {
        const res = await fetch('/api/record/start');
        const data = await res.json();
        if (data.status === 'started' || data.status === 'already_recording') {
          isRecording = true;
          recBtn.classList.add('recording');
          secondsElapsed = 0;
          startHeartbeat();
          recTimer = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            recText.textContent = `${mins}:${secs}`;
          }, 1000);
        }
      } else {
        const res = await fetch('/api/record/stop');
        await res.json();
        isRecording = false;
        clearInterval(recTimer);
        stopHeartbeat();
        recTimer = null;
        recBtn.classList.remove('recording');
        recText.textContent = 'REC';
      }
    }

    // Gallery Actions
    function startGalleryPolling() {
      if (!galleryPollTimer) {
        galleryPollTimer = setInterval(loadGallery, 1500);
      }
    }

    function stopGalleryPolling() {
      if (galleryPollTimer) {
        clearInterval(galleryPollTimer);
        galleryPollTimer = null;
      }
    }

    async function loadGallery() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/gallery');
        if (!res.ok) return;
        const data = await res.json();
        const jsonStr = JSON.stringify(data.items);
        if (jsonStr === lastGalleryJson) {
          return; // Skip re-rendering and re-fetching thumbnails if list has not changed
        }
        lastGalleryJson = jsonStr;

        grid.innerHTML = "";

        if (data.items.length === 0) {
          grid.innerHTML = "<div style='color:#777; grid-column: 1/-1; text-align:center; padding-top:40px;'>No clips recorded yet</div>";
          return;
        }

        data.items.forEach(item => {
          const isMp4 = currentSettings.download_format === 'mp4';
          const displayName = isMp4 ? item.mp4_name : item.raw_name;

          let displaySize = `${item.raw_size_mb} MB`;
          let statusText = 'Raw MKV';
          if (isMp4) {
            if (item.ready) {
              displaySize = item.mp4_size_mb !== null ? `${item.mp4_size_mb} MB` : `${item.size_mb} MB`;
              statusText = 'Ready';
            } else if (item.encoding) {
              displaySize = `${item.raw_size_mb} MB`;
              statusText = item.progress > 0 
                ? `Encoding (${item.progress}%) • ${item.eta_text}` 
                : (item.eta_text ? `Encoding • ${item.eta_text}` : 'Encoding...');
            } else {
              displaySize = `${item.raw_size_mb} MB`;
              statusText = 'Encoding...';
            }
          }

          const saveUrl = isMp4 ? item.mp4 : item.mkv;
          const canSave = isMp4 ? item.ready : true;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${item.thumb 
              ? `<img class="card-thumb" src="${item.thumb}" alt="thumb">` 
              : `<div class="card-thumb">${item.encoding ? (item.progress > 0 ? 'ENCODING ' + item.progress + '%' : (item.eta_text || 'PROCESSING...').toUpperCase()) : 'PROCESSING...'}</div>`}
            <div class="card-body">
              <div class="card-title">${displayName}</div>
              <div class="card-meta">${displaySize} • ${statusText}</div>
              ${item.encoding ? `
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${item.progress}%;"></div>
                </div>
              ` : ''}
              <div class="card-actions">
                <button class="btn-play ${item.ready ? '' : 'btn-disabled'}" onclick="playVideo('${item.mp4}')">PLAY</button>
                <button class="btn-dl ${canSave ? '' : 'btn-disabled'}" onclick="saveToPhone(this, '${saveUrl}', '${displayName}')">SAVE</button>
                <button class="btn-del" onclick="deleteRecording('${item.id}', '${displayName}')" title="Delete Recording">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load gallery:", err);
      }
    }

    // Save recording directly to iPhone Photos / Camera Roll via native Share Sheet
    async function saveToPhone(btn, url, filename) {
      if (!url) return;
      const originalText = btn.textContent;
      btn.textContent = '...';
      btn.style.pointerEvents = 'none';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to fetch recording");
        const blob = await res.blob();
        const file = new File([blob], filename, { type: 'video/mp4' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: filename
          });
        } else {
          // Fallback for desktop browsers
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error("Save error:", err);
          alert("Could not save video: " + err.message);
        }
      } finally {
        btn.textContent = originalText;
        btn.style.pointerEvents = 'auto';
      }
    }

    // Delete Recording with confirmation
    async function deleteRecording(id, name) {
      const confirmed = window.confirm(`Delete recording "${name}"?\n\nThis will permanently remove it from the Pi.`);
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/record/delete?id=${encodeURIComponent(id)}`, { method: 'POST' });
        const data = await res.json();
        if (data.status === 'deleted') {
          lastGalleryJson = "";
          loadGallery();
        } else {
          alert("Failed to delete recording: " + (data.message || "File not found"));
        }
      } catch (err) {
        console.error("Delete error:", err);
        alert("Error deleting recording");
      }
    }

    // Inline iOS Video Player
    function playVideo(url) {
      stopGalleryPolling();
      videoPlayer.src = url;
      playerModal.classList.add('active');
      videoPlayer.play();
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load(); // Forces iOS WebKit to release decoder and media buffers
      playerModal.classList.remove('active');
      startGalleryPolling();
    }

    // View Router based on URL state
    const urlParams = new URLSearchParams(window.location.search);
    const isGalleryView = urlParams.get('view') === 'gallery';

    loadSettings().then(() => {
      if (isGalleryView) {
        // In Gallery View: NEVER load the EVF stream (0 Mbps over USB link)
        viewportContainer.style.display = 'none';
        galleryView.classList.add('active');
        loadGallery();
        startGalleryPolling();
      } else {
        // In Live View: Show EVF with clean native hardware MJPEG decoding
        galleryView.classList.remove('active');
        viewportContainer.style.display = 'flex';
        startLiveStream();
        syncRecordStatus();
      }
    });
  </script>
</body>
