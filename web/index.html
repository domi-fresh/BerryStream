<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Canopi EVF Monitor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #evf-feed {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: env(safe-area-inset-left, 18px);
      background: rgba(0, 0, 0, 0.65);
      color: #00ff66;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-alert { color: #ff3344 !important; }

    .ctrl-btn {
      position: absolute;
      background: rgba(18, 18, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: scale(0.96); }

    #rec-btn {
      top: env(safe-area-inset-top, 16px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 20px;
      min-width: 110px;
    }
    #rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3344;
    }
    #rec-btn.recording {
      background: rgba(255, 51, 68, 0.25);
      border-color: #ff3344;
      color: #ff3344;
    }
    #rec-btn.recording #rec-dot { animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.2; } }

    #files-btn {
      bottom: env(safe-area-inset-bottom, 18px);
      right: env(safe-area-inset-right, 18px);
      padding: 12px 22px;
    }

    /* Full-screen Gallery Overlay */
    #gallery-view {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 40;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
    }
    #gallery-view.active { display: flex; }
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gallery-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 16px 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1c1c1e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 11px;
    }
    .card-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { font-size: 10px; color: #888; }
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-play, .btn-dl {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-play { background: #00ff66; color: #000; }
    .btn-dl { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-disabled { opacity: 0.4; pointer-events: none; }

    /* Video Player Overlay */
    #player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-modal.active { display: flex; }
    #video-player {
      width: 100%;
      max-height: 85vh;
    }
    #close-player {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: env(safe-area-inset-right, 20px);
      padding: 10px 18px;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div id="hud">USB LINK • LIVE</div>

    <button id="rec-btn" class="ctrl-btn" onclick="toggleRecord()">
      <div id="rec-dot"></div>
      <span id="rec-text">REC</span>
    </button>

    <button id="files-btn" class="ctrl-btn" onclick="openGallery()">GALLERY</button>

    <img id="evf-feed" alt="Live EVF Stream">
  </div>

  <!-- Gallery View -->
  <div id="gallery-view">
    <div class="gallery-header">
      <span style="color:#fff; font-size:18px; font-weight:700;">RECORDINGS</span>
      <button class="ctrl-btn" style="position:static; padding:8px 16px;" onclick="closeGallery()">BACK TO EVF</button>
    </div>
    <div class="gallery-grid" id="grid"></div>
  </div>

  <!-- Video Playback Modal -->
  <div id="player-modal">
    <button id="close-player" class="ctrl-btn" onclick="closePlayer()">CLOSE</button>
    <video id="video-player" controls playsinline webkit-playsinline></video>
  </div>

  <script>
    const streamImg = document.getElementById('evf-feed');
    const hud = document.getElementById('hud');
    const recBtn = document.getElementById('rec-btn');
    const recText = document.getElementById('rec-text');
    let isRecording = false;
    let recTimer = null;
    let secondsElapsed = 0;

    // Live Stream Reader Engine (fetch + AbortController + frame drop)
    const streamBuffer = new Uint8Array(4 * 1024 * 1024);
    let streamBufferLen = 0;
    let streamAbortController = null;
    let currentBlobUrl = null;
    let isRendering = false;
    let reconnectTimeout = null;

    function getStreamUrl() {
      return `${window.location.protocol}//${window.location.hostname}:1984/api/stream.mjpeg?src=evf`;
    }

    function findSOI(buf, from, to) {
      for (let i = from; i < to - 1; i++) {
        if (buf[i] === 0xFF && buf[i + 1] === 0xD8) return i;
      }
      return -1;
    }

    function findEOI(buf, from, to) {
      for (let i = from; i < to - 1; i++) {
        if (buf[i] === 0xFF && buf[i + 1] === 0xD9) return i;
      }
      return -1;
    }

    function renderFrame(jpegBytes) {
      // If the browser hasn't finished painting the previous frame, drop this one to avoid lag
      if (isRendering) return;
      isRendering = true;

      const blob = new Blob([jpegBytes], { type: 'image/jpeg' });
      const newUrl = URL.createObjectURL(blob);

      const resetTimer = setTimeout(() => {
        isRendering = false;
      }, 40);

      streamImg.onload = () => {
        clearTimeout(resetTimer);
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }
        currentBlobUrl = newUrl;
        isRendering = false;
        hud.textContent = "USB LINK • LIVE";
        hud.classList.remove('hud-alert');
      };

      streamImg.onerror = () => {
        clearTimeout(resetTimer);
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
        }
        isRendering = false;
      };

      streamImg.src = newUrl;
    }

    function pauseLiveStream() {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }
      // Force immediate TCP socket abort in browser networking process
      if (streamAbortController) {
        streamAbortController.abort();
        streamAbortController = null;
      }
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
      isRendering = false;
      streamBufferLen = 0;
    }

    async function startLiveStream() {
      pauseLiveStream();

      streamAbortController = new AbortController();
      const signal = streamAbortController.signal;

      try {
        const res = await fetch(`${getStreamUrl()}&t=${Date.now()}`, {
          signal,
          cache: 'no-store'
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        if (!res.body) throw new Error("ReadableStream not supported");

        const reader = res.body.getReader();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Discard header preamble before first SOI if buffer was empty
          if (streamBufferLen === 0) {
            const firstSoi = findSOI(value, 0, value.length);
            if (firstSoi === -1) continue;
            const useful = value.slice(firstSoi);
            streamBuffer.set(useful, 0);
            streamBufferLen = useful.length;
          } else {
            if (streamBufferLen + value.length > streamBuffer.length) {
              streamBufferLen = 0;
              continue;
            }
            streamBuffer.set(value, streamBufferLen);
            streamBufferLen += value.length;
          }

          // Discard any multipart headers between frames
          const firstSoi = findSOI(streamBuffer, 0, streamBufferLen);
          if (firstSoi > 0) {
            streamBuffer.copyWithin(0, firstSoi, streamBufferLen);
            streamBufferLen -= firstSoi;
          }

          // Scan for complete frames in buffer, always selecting the newest
          let lastFrameStart = -1;
          let lastFrameEnd = -1;
          let searchPos = 0;

          while (searchPos < streamBufferLen - 1) {
            const soi = findSOI(streamBuffer, searchPos, streamBufferLen);
            if (soi === -1) break;

            const eoi = findEOI(streamBuffer, soi + 2, streamBufferLen);
            if (eoi === -1) break;

            lastFrameStart = soi;
            lastFrameEnd = eoi + 2;
            searchPos = lastFrameEnd; // Continue scanning for even fresher frame in this batch
          }

          // Render only the latest frame found, dropping any older completed frames
          if (lastFrameStart !== -1 && lastFrameEnd !== -1) {
            const frameBytes = streamBuffer.slice(lastFrameStart, lastFrameEnd);
            renderFrame(frameBytes);

            const leftover = streamBufferLen - lastFrameEnd;
            if (leftover > 0) {
              streamBuffer.copyWithin(0, lastFrameEnd, streamBufferLen);
            }
            streamBufferLen = leftover;
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') return; // Clean user-initiated pause
        console.error("Stream reader error:", err);
        hud.textContent = "SIGNAL LOST • RETRYING";
        hud.classList.add('hud-alert');
        if (!document.getElementById('gallery-view').classList.contains('active')) {
          reconnectTimeout = setTimeout(() => {
            reconnectTimeout = null;
            if (!document.getElementById('gallery-view').classList.contains('active')) {
              startLiveStream();
            }
          }, 1000);
        }
      }
    }

    startLiveStream();

    // Keep screen awake
    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
    }
    requestWakeLock();

    // Toggle Record
    async function toggleRecord() {
      if (!isRecording) {
        const res = await fetch('/api/record/start');
        const data = await res.json();
        if (data.status === 'started' || data.status === 'already_recording') {
          isRecording = true;
          recBtn.classList.add('recording');
          secondsElapsed = 0;
          recTimer = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            recText.textContent = `${mins}:${secs}`;
          }, 1000);
        }
      } else {
        const res = await fetch('/api/record/stop');
        await res.json();
        isRecording = false;
        clearInterval(recTimer);
        recBtn.classList.remove('recording');
        recText.textContent = 'REC';
      }
    }

    // Gallery Actions
    let galleryPollTimer = null;
    let lastGalleryJson = "";

    function startGalleryPolling() {
      if (!galleryPollTimer) {
        galleryPollTimer = setInterval(loadGallery, 2000);
      }
    }

    function stopGalleryPolling() {
      if (galleryPollTimer) {
        clearInterval(galleryPollTimer);
        galleryPollTimer = null;
      }
    }

    function openGallery() {
      pauseLiveStream();
      document.getElementById('gallery-view').classList.add('active');
      lastGalleryJson = "";
      loadGallery();
      startGalleryPolling();
    }

    function closeGallery() {
      if (playerModal.classList.contains('active')) {
        closePlayer();
      }
      document.getElementById('gallery-view').classList.remove('active');
      stopGalleryPolling();
      startLiveStream();
    }

    async function loadGallery() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/gallery');
        if (!res.ok) return;
        const data = await res.json();
        const jsonStr = JSON.stringify(data.items);
        if (jsonStr === lastGalleryJson) {
          return; // Skip re-rendering and re-fetching thumbnails if list has not changed
        }
        lastGalleryJson = jsonStr;

        grid.innerHTML = "";

        if (data.items.length === 0) {
          grid.innerHTML = "<div style='color:#777; grid-column: 1/-1; text-align:center; padding-top:40px;'>No clips recorded yet</div>";
          return;
        }

        data.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            ${item.thumb 
              ? `<img class="card-thumb" src="${item.thumb}" alt="thumb">` 
              : `<div class="card-thumb">PROCESSING...</div>`}
            <div class="card-body">
              <div class="card-title">${item.raw_name}</div>
              <div class="card-meta">${item.size_mb} MB • ${item.ready ? 'Ready' : 'Encoding...'}</div>
              <div class="card-actions">
                <button class="btn-play ${item.ready ? '' : 'btn-disabled'}" onclick="playVideo('${item.mp4}')">PLAY</button>
                <a class="btn-dl ${item.ready ? '' : 'btn-disabled'}" href="${item.mp4}" download>SAVE</a>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load gallery:", err);
      }
    }

    // Inline iOS Video Player
    const playerModal = document.getElementById('player-modal');
    const videoPlayer = document.getElementById('video-player');

    function playVideo(url) {
      stopGalleryPolling(); // Pause gallery polling while video is playing
      videoPlayer.src = url;
      playerModal.classList.add('active');
      videoPlayer.play();
    }

    function closePlayer() {
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load(); // Forces iOS WebKit to release decoder and media buffers
      playerModal.classList.remove('active');
      startGalleryPolling(); // Resume gallery polling
    }
  </script>
</body>
</html>
